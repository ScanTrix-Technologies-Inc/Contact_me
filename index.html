  .role { margin-top: 8px; color: #334155; font-size: 15px; font-weight: 600; }
  .socials-hero { display:flex; justify-content:center; gap:12px; margin-top:16px; }
  .social-btn { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; text-decoration:none; box-shadow:0 6px 16px rgba(15,23,42,0.12); transition:transform .12s ease, box-shadow .12s ease; }
  .social-btn:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(15,23,42,0.18); }
  .social-btn svg { width:22px; height:22px; }
  .pick { margin: 26px 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing:.08em; color:#94a3b8; font-weight:600; }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option {
    display: flex; align-items: center; gap: 16px; text-align: left;
    width: 100%; cursor: pointer; border: 1px solid #e9ecf3; border-left-width: 4px;
    background: #fff; padding: 18px; border-radius: 18px;
    transition: transform .12s ease, box-shadow .12s ease;
    font: inherit; color: inherit;
  }
  .option:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(15,23,42,0.12); }
  .option .badge {
    width: 54px; height: 54px; flex: 0 0 54px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center; color:#fff;
  }
  .option .badge svg { width: 26px; height: 26px; }
  .option .otxt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .option .ot { font-size: 16px; font-weight: 700; line-height: 1.25; }
  .option .os { font-size: 13px; color:#64748b; margin-top: 4px; }
  .option .arrow { color:#cbd5e1; }

  /* ---------- Detail views ---------- */
  .detail-head { padding: 26px 30px 4px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: none; border: none; font: inherit; color: var(--accent);
    font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 16px;
  }
  .back svg { width: 16px; height: 16px; }
  .detail-body { padding: 0 30px 30px; }
  .dh { font-size: 22px; font-weight: 700; }
  .dsub { font-size: 13px; font-weight: 700; letter-spacing:.04em; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
  .blurb { margin-top: 10px; color:#475569; font-size: 15px; line-height: 1.55; }
  .list { list-style: none; margin: 20px 0 0; display: flex; flex-direction: column; gap: 11px; }
  .list li { display: flex; align-items: flex-start; gap: 11px; font-size: 14.5px; color:#1e293b; }
  .list li .tick {
    width: 20px; height: 20px; flex: 0 0 20px; margin-top: 1px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .list li .tick svg { width: 12px; height: 12px; }
  .ctas { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 18px; border-radius: 14px; text-decoration: none; font-weight: 600; font-size: 15px;
    transition: transform .12s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn svg { width: 18px; height: 18px; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; box-shadow: 0 10px 24px -10px var(--accent); }
  .btn-dark { background: var(--dark); color:#fff; }
  .btn-ghost { background:#fff; color: var(--dark); border:1px solid #e2e8f0; }
  .footer { text-align:center; font-size:12px; color:#94a3b8; padding: 4px 0 24px; }
</style>
</head>
<body>
  <main class="card">

    <!-- ===== HERO ===== -->
    <section class="view active" id="home">
      <div class="banner" id="banner"></div>
      <div class="avatar-wrap" id="avatarWrap"></div>
      <div class="hero-body">
        <h1 class="name" id="name"></h1>
        <div class="creds" id="creds"></div>
        <div class="role" id="role"></div>
        <div class="socials-hero" id="socialsHero"></div>
        <div class="pick">What can I help you with?</div>
        <div class="options">
          <button class="option" id="opt1" data-go="scantrix">
            <span class="badge" id="b1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
            </span>
            <span class="otxt"><span class="ot" id="o1t"></span><span class="os" id="o1s"></span></span>
            <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
          </button>
          <button class="option" id="opt2" data-go="accounting">
            <span class="badge" id="b2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/><path d="M4 3l2 2M20 3l-2 2"/></svg>
            </span>
            <span class="otxt"><span class="ot" id="o2t"></span><span class="os" id="o2s"></span></span>
            <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></span>
          </button>
        </div>
      </div>
      <div class="footer" id="footerHome"></div>
    </section>

    <!-- ===== SCANTRIX ===== -->
    <section class="view" id="scantrix">
      <div class="detail-head">
        <button class="back" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Back</button>
        <div class="dsub" id="s_sub"></div>
        <div class="dh" id="s_head"></div>
      </div>
      <div class="detail-body">
        <p class="blurb" id="s_blurb"></p>
        <ul class="list" id="s_list"></ul>
        <div class="ctas" id="s_ctas"></div>
      </div>
      <div class="footer" id="footerS"></div>
    </section>

    <!-- ===== ACCOUNTING ===== -->
    <section class="view" id="accounting">
      <div class="detail-head">
        <button class="back" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Back</button>
        <div class="dh" id="a_head"></div>
      </div>
      <div class="detail-body">
        <p class="blurb" id="a_blurb"></p>
        <ul class="list" id="a_list"></ul>
        <div class="ctas" id="a_ctas"></div>
      </div>
      <div class="footer" id="footerA"></div>
    </section>

  </main>

<script>
(function () {
  const s = SITE;
  const grad = t => 'linear-gradient(135deg, ' + t.a + ', ' + t.b + ')';

  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 4 4 10-10"/></svg>';
  const MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  const GLOBE= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>';
  const APPLE= '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.417 2.2-1.11 3-.76.87-2 .54-2.06.53-.07-1.02.44-2.1 1.06-2.79.7-.79 1.9-1.36 2.11-1.36.01.03 0 .01 0 .62zM20.7 17.2c-.35.8-.52 1.15-.97 1.86-.63.98-1.52 2.2-2.62 2.21-.98.01-1.23-.64-2.56-.63-1.33.01-1.6.64-2.58.63-1.1-.01-1.94-1.11-2.57-2.09-1.76-2.74-1.95-5.96-.86-7.67.77-1.22 1.99-1.94 3.14-1.94 1.17 0 1.9.64 2.87.64.94 0 1.51-.64 2.87-.64 1.02 0 2.1.56 2.87 1.52-2.52 1.38-2.11 4.98.41 6.15z"/></svg>';
  const PHONE= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>';

  // ----- Hero -----
  document.getElementById('banner').style.background = grad(s.heroTheme);
  const initials = (s.name||"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("") || "•";
  const aw = document.getElementById('avatarWrap');
  if (s.photo) aw.innerHTML = '<img class="avatar" src="'+s.photo+'" alt="'+(s.name||'')+'">';
  else aw.innerHTML = '<div class="avatar">'+initials+'</div>';
  document.getElementById('name').textContent = s.name || "";
  const cEl = document.getElementById('creds');
  if (s.credentials) cEl.textContent = s.credentials; else cEl.remove();
  document.getElementById('role').textContent = s.title || "";

  // Social logos (LinkedIn, Instagram)
  const LINKEDIN_ICON = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4.98 3.5A2.5 2.5 0 1 1 0 3.5a2.5 2.5 0 0 1 4.98 0zM.4 8.02h4.16V24H.4zM8.34 8.02h3.99v2.18h.06c.56-1.06 1.92-2.18 3.95-2.18 4.22 0 5 2.78 5 6.4V24h-4.16v-7.4c0-1.77-.03-4.04-2.46-4.04-2.46 0-2.84 1.92-2.84 3.91V24H8.34z"/></svg>';
  const INSTAGRAM_ICON = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.2c3.2 0 3.6.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.43.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.43.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.43-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.43-.16 1.06-.36 2.23-.41C8.42 2.21 8.8 2.2 12 2.2zm0 1.8c-3.15 0-3.5.01-4.72.07-.9.04-1.38.19-1.7.32-.43.17-.74.36-1.06.68-.32.32-.51.63-.68 1.06-.13.32-.28.8-.32 1.7-.06 1.22-.07 1.57-.07 4.72s.01 3.5.07 4.72c.04.9.19 1.38.32 1.7.17.43.36.74.68 1.06.32.32.63.51 1.06.68.32.13.8.28 1.7.32 1.22.06 1.57.07 4.72.07s3.5-.01 4.72-.07c.9-.04 1.38-.19 1.7-.32.43-.17.74-.36 1.06-.68.32-.32.51-.63.68-1.06.13-.32.28-.8.32-1.7.06-1.22.07-1.57.07-4.72s-.01-3.5-.07-4.72c-.04-.9-.19-1.38-.32-1.7a2.85 2.85 0 0 0-.68-1.06 2.85 2.85 0 0 0-1.06-.68c-.32-.13-.8-.28-1.7-.32C15.5 4.01 15.15 4 12 4zm0 3.06A4.94 4.94 0 1 0 12 16.94 4.94 4.94 0 0 0 12 7.06zm0 8.14A3.2 3.2 0 1 1 12 8.8a3.2 3.2 0 0 1 0 6.4zm6.28-8.34a1.15 1.15 0 1 1-2.3 0 1.15 1.15 0 0 1 2.3 0z"/></svg>';
  const sh = document.getElementById('socialsHero');
  function socialBtn(href, bg, icon){ const a=document.createElement('a'); a.className='social-btn'; a.href=href; a.target='_blank'; a.rel='noopener'; a.style.background=bg; a.innerHTML=icon; return a; }
  if (s.social && s.social.linkedin)  sh.appendChild(socialBtn(s.social.linkedin, '#0A66C2', LINKEDIN_ICON));
  if (s.social && s.social.instagram) sh.appendChild(socialBtn(s.social.instagram, 'linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)', INSTAGRAM_ICON));
  if (!sh.children.length) sh.remove();

  // Option cards — each in its own brand theme
  document.getElementById('o1t').textContent = s.scantrix.heading;
  document.getElementById('o1s').textContent = s.scantrix.subhead || "";
  document.getElementById('o2t').textContent = s.accounting.heading;
  document.getElementById('o2s').textContent = "Services & enquiries";
  const opt1 = document.getElementById('opt1'), opt2 = document.getElementById('opt2');
  document.getElementById('b1').style.background = grad(s.scantrix.theme);
  opt1.style.borderLeftColor = s.scantrix.theme.a;
  document.getElementById('b2').style.background = grad(s.accounting.theme);
  opt2.style.borderLeftColor = s.accounting.theme.a;

  function applyTheme(el, t) {
    el.style.setProperty('--accent', t.a);
    el.style.setProperty('--accent2', t.b);
    el.style.setProperty('--dark', t.dark);
  }
  function btn(cls, icon, label, href) {
    const a = document.createElement('a'); a.className='btn '+cls; a.href=href;
    if (href.startsWith('http')) { a.target='_blank'; a.rel='noopener'; }
    a.innerHTML = icon + '<span>'+label+'</span>'; return a;
  }

  // ----- ScanTrix view -----
  const sv = document.getElementById('scantrix');
  applyTheme(sv, s.scantrix.theme);
  document.getElementById('s_sub').textContent = s.scantrix.subhead || "";
  document.getElementById('s_head').textContent = s.scantrix.heading;
  document.getElementById('s_blurb').textContent = s.scantrix.blurb;
  const sList = document.getElementById('s_list');
  (s.scantrix.features||[]).forEach(f => { const li=document.createElement('li'); li.innerHTML='<span class="tick">'+TICK+'</span><span>'+f+'</span>'; sList.appendChild(li); });
  const sCtas = document.getElementById('s_ctas');
  if (s.scantrix.webAppUrl) sCtas.appendChild(btn('btn-primary', GLOBE, 'Open the Web App', s.scantrix.webAppUrl));
  if (s.scantrix.iosUrl)    sCtas.appendChild(btn('btn-dark', APPLE, 'Download on the App Store', s.scantrix.iosUrl));
  if (s.scantrix.email)     sCtas.appendChild(btn('btn-ghost', MAIL, s.scantrix.email, 'mailto:'+s.scantrix.email));
  if (s.scantrix.phone)     sCtas.appendChild(btn('btn-ghost', PHONE, s.scantrix.phone, 'tel:'+s.scantrix.phone.replace(/[^\d+]/g,'')));

  // ----- Accounting view -----
  const av = document.getElementById('accounting');
  applyTheme(av, s.accounting.theme);
  document.getElementById('a_head').textContent = s.accounting.heading;
  document.getElementById('a_blurb').textContent = s.accounting.blurb;
  const aList = document.getElementById('a_list');
  (s.accounting.services||[]).forEach(f => { const li=document.createElement('li'); li.innerHTML='<span class="tick">'+TICK+'</span><span>'+f+'</span>'; aList.appendChild(li); });
  const aCtas = document.getElementById('a_ctas');
  if (s.accounting.email) aCtas.appendChild(btn('btn-primary', MAIL, s.accounting.email, 'mailto:'+s.accounting.email));
  if (s.accounting.phone) aCtas.appendChild(btn('btn-dark', PHONE, s.accounting.phone, 'tel:'+s.accounting.phone.replace(/[^\d+]/g,'')));

  // ----- Footer -----
  const yr = new Date().getFullYear();
  const foot = '© ' + yr + ' ' + (s.name || '');
  ['footerHome','footerS','footerA'].forEach(id => document.getElementById(id).textContent = foot);

  // ----- Navigation (hash-based, shareable, back works) -----
  const views = ['home','scantrix','accounting'];
  function show(id){ if(!views.includes(id)) id='home'; views.forEach(v=>document.getElementById(v).classList.toggle('active', v===id)); window.scrollTo(0,0); }
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', ()=>{ location.hash = el.getAttribute('data-go'); }));
  document.querySelectorAll('[data-back]').forEach(el => el.addEventListener('click', ()=>{ location.hash=''; }));
  window.addEventListener('hashchange', ()=> show(location.hash.replace('#','')));
  show(location.hash.replace('#',''));
})();
</script>
</body>
</html>
